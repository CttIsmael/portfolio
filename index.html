<style>
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --surface-2:#E7EDF8; --line:#D3DCEC;
  --text:#0A1530; --muted:#4D5C7D; --accent:#1D5EF0; --accent-2:#2F7BFF;
  --on-accent:#FFFFFF; --glow:rgba(29,94,240,.16); --header-bg:rgba(242,245,251,.86);
  --strand-a:#1D5EF0; --strand-b:#7FB4FF; --strand-mode:source-over;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --radius-lg:28px; --radius-md:16px; --radius-pill:999px;
  --wrap:1200px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#050A16; --surface:#0A1428; --surface-2:#0F1C36; --line:#1B2A4A;
    --text:#E6EEFB; --muted:#8C9CBD; --accent:#3D8BFF; --accent-2:#7CC4FF;
    --on-accent:#031230; --glow:rgba(61,139,255,.22); --header-bg:rgba(5,10,22,.8);
    --strand-a:#1F5BFF; --strand-b:#DCEBFF; --strand-mode:lighter;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050A16; --surface:#0A1428; --surface-2:#0F1C36; --line:#1B2A4A;
  --text:#E6EEFB; --muted:#8C9CBD; --accent:#3D8BFF; --accent-2:#7CC4FF;
  --on-accent:#031230; --glow:rgba(61,139,255,.22); --header-bg:rgba(5,10,22,.8);
  --strand-a:#1F5BFF; --strand-b:#DCEBFF; --strand-mode:lighter;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:6px}
.wrap{width:min(var(--wrap),100% - 48px);margin-inline:auto}
.mono{font-family:var(--font-mono);font-size:13px;letter-spacing:.06em}

/* ---------- header ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}
.logo{display:flex;align-items:center;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:16px;height:16px;color:var(--accent-2)}
.nav-links{display:flex;gap:36px;list-style:none;margin:0;padding:0}
.nav-links a{text-decoration:none;font-weight:500;font-size:15px;color:var(--muted);padding:8px 0;position:relative;transition:color .2s}
.nav-links a:hover,.nav-links a[aria-current="true"]{color:var(--text)}
.nav-links a[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--accent-2)}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:6px}
.lang button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px;cursor:pointer;opacity:.5;transition:opacity .2s,border-color .2s;display:grid;place-items:center}
.lang button[aria-pressed="true"]{opacity:1;border-color:var(--accent-2)}
.lang svg{width:26px;height:18px;border-radius:3px;display:block}
.menu-btn{display:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;width:42px;height:42px;cursor:pointer}
.menu-btn svg{width:20px;height:20px}
@media (max-width:860px){
  .menu-btn{display:grid;place-items:center}
  .nav-links{position:absolute;top:72px;left:0;right:0;flex-direction:column;gap:0;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 24px 16px;display:none}
  .nav-links.open{display:flex}
  .nav-links a{display:block;padding:14px 0;font-size:17px;border-bottom:1px solid var(--line)}
  .nav-links a[aria-current="true"]::after{display:none}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 30px;border-radius:var(--radius-pill);font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:var(--font-body);transition:transform .2s,background .2s,border-color .2s}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2);transform:translateY(-2px)}
.btn-ghost{border-color:var(--line);color:var(--text);background:transparent}
.btn-ghost:hover{border-color:var(--accent-2);transform:translateY(-2px)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:calc(100svh - 72px);display:flex;align-items:center;overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 70% at 78% 60%,var(--glow),transparent 70%)}
.hero-inner{padding:72px 0 140px;max-width:600px}
.tag{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-pill);padding:10px 20px;background:color-mix(in srgb,var(--surface) 60%,transparent);backdrop-filter:blur(6px)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 12px var(--accent-2)}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,5vw,68px);line-height:1.02;letter-spacing:-.035em;margin:28px 0 24px}
.hero h1 .hl{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(17px,1.5vw,19px);color:var(--muted);max-width:560px;margin:0 0 40px}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap}
.motion{position:absolute;top:50%;right:max(24px,calc((100vw - var(--wrap))/2));transform:translateY(-52%);width:min(43vw,560px);z-index:1}
.motion svg.graph{width:100%;height:auto;display:block;overflow:visible;cursor:ew-resize;touch-action:pan-y}
.motion svg.graph .g-panel{transition:stroke .25s}
.motion svg.graph:hover .g-panel,.motion svg.graph.active .g-panel{stroke:var(--accent-2)}
.g-hint{font-family:var(--font-mono);font-size:12px;fill:var(--accent-2);letter-spacing:.04em;transition:opacity .3s}
.motion svg.graph.active .g-hint{opacity:0}
.g-panel{fill:color-mix(in srgb,var(--surface) 72%,transparent);stroke:var(--line)}
.g-grid{stroke:var(--line);stroke-width:1}
.g-label{font-family:var(--font-mono);font-size:12px;fill:var(--muted);letter-spacing:.06em}
.g-value{fill:none;stroke:var(--text);stroke-width:2.5}
.g-speed{fill:none;stroke:var(--accent-2);stroke-width:2;stroke-dasharray:6 7;opacity:.75}
.g-speedfill{fill:var(--accent-2);opacity:.08}
.g-handle{stroke:var(--accent-2);stroke-width:1.5}
.g-handle-end{fill:var(--bg);stroke:var(--accent-2);stroke-width:1.5}
.g-kf-out{fill:var(--bg);stroke:var(--text);stroke-width:2;stroke-linejoin:round}
.g-kf-in{fill:var(--accent-2)}
.g-playhead{stroke:var(--accent);stroke-width:1.5}
.g-ph-tag{fill:var(--accent)}
.g-ph-text{font-family:var(--font-mono);font-size:11px;fill:#fff}
.g-dot{fill:var(--accent-2)}
.g-dot-glow{fill:var(--accent-2);opacity:.25}
.g-trail{fill:none;stroke:var(--accent-2);stroke-width:3;stroke-linecap:round;opacity:.5}
.g-track{stroke:var(--line);stroke-width:2}
.g-obj{fill:var(--accent)}
.g-ghost{fill:var(--accent-2)}
.g-streak{stroke:var(--accent-2);stroke-width:2;stroke-linecap:round}
.g-readout{font-family:var(--font-mono);font-size:12px;fill:var(--text)}
.scroll-hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);text-decoration:none;background:var(--bg)}
.scroll-hint svg{width:18px;height:18px}
.hero-curve{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:-1;pointer-events:none}
@media (max-width:1180px){.motion{width:min(40vw,480px)}}
@media (max-width:860px){
  .hero{min-height:auto}
  .hero-inner{padding:72px 0 120px}
  .motion{position:relative;top:auto;right:auto;transform:none;width:100%;max-width:460px;margin:-80px 0 96px;z-index:0}
}

/* ---------- sections ---------- */
section.block{padding:120px 0;border-top:1px solid var(--line)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--muted);margin-bottom:28px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-2)}
.eyebrow::after{content:"";width:56px;height:1px;background:var(--accent-2);opacity:.7}
h2.title{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,4.6vw,60px);line-height:1.06;letter-spacing:-.03em;margin:0 0 20px;max-width:20ch}
.sub{color:var(--muted);max-width:60ch;margin:0}

/* ---------- about ---------- */
.about-top{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:72px;align-items:center}
.portrait{position:relative;aspect-ratio:4/5;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--accent) 45%,transparent));mix-blend-mode:multiply;pointer-events:none}
.portrait figcaption{position:absolute;left:16px;bottom:16px;right:16px;display:flex;justify-content:space-between;color:#fff;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;z-index:1;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.about-intro{color:var(--muted);font-size:19px;max-width:58ch;margin:0 0 28px}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:12px 48px;margin:0;padding:24px 0 0;border-top:1px solid var(--line)}
.stats div{margin:0}
.stats dt{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,2.8vw,40px);line-height:1;letter-spacing:-.03em;color:var(--text);white-space:nowrap}
.stats dt .arrow{color:var(--accent-2)}
.stats dd{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:18ch}
@media (max-width:1180px){.stats{grid-template-columns:1fr 1fr;gap:20px 28px}.stats div:nth-child(3){grid-column:span 2}.stats dd{max-width:none}}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 12px)}
.contact-ctas{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
.journey{margin-top:110px;display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:72px}
.journey-head{position:sticky;top:120px;align-self:start}
.journey-head h3{font-family:var(--font-display);font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
.journey-head p{color:var(--muted);margin:0}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:1px;background:linear-gradient(var(--accent-2),var(--line))}
.step{position:relative;padding:0 0 48px 48px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:0;top:6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--accent-2)}
.step:last-child::before{background:var(--accent-2);box-shadow:0 0 0 6px var(--glow)}
.step .when{color:var(--accent-2);margin-bottom:6px}
.step h4{font-family:var(--font-display);font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:0 0 10px}
.step p{margin:0;color:var(--muted);max-width:62ch}
@media (max-width:960px){
  .about-top,.journey{grid-template-columns:1fr;gap:48px}
  .portrait{max-width:380px}
  .journey-head{position:static}
}

/* ---------- services ---------- */
.services-head{display:flex;justify-content:space-between;align-items:end;gap:40px;flex-wrap:wrap;margin-bottom:56px}
.svc-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.svc{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr minmax(200px,.9fr);gap:40px;padding:36px 0;border-bottom:1px solid var(--line);align-items:start;transition:background .25s}
.svc h3{font-family:var(--font-display);font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0;display:flex;gap:14px;align-items:center}
.svc h3 svg{width:28px;height:28px;flex:none;color:var(--accent-2)}
.svc p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:var(--radius-pill);padding:6px 14px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.svc:hover h3{color:var(--accent-2)}
@media (max-width:900px){.svc{grid-template-columns:1fr;gap:14px;padding:28px 0}}

/* ---------- projects ---------- */
.featured{--p:var(--accent-2);margin-top:56px;display:grid;grid-template-columns:1.35fr 1fr;border:1px solid var(--p);transition:border-color .35s,box-shadow .35s;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);min-height:520px;box-shadow:0 40px 90px -50px var(--p)}
.cover{position:relative;overflow:hidden;background:#06122C;min-height:320px}
.cover svg,.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.featured .cover{min-height:440px}
.featured .cover img{object-position:0% 50%;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.featured .cover img{animation:none}}
.f-info{padding:44px 44px 36px;display:flex;flex-direction:column;gap:18px}
.f-meta{color:var(--muted)}
.pill{align-self:flex-start;border:1px solid color-mix(in srgb,var(--p) 55%,var(--line));border-radius:var(--radius-pill);padding:6px 14px;font-size:14px;color:color-mix(in srgb,var(--p) 75%,var(--text))}
.f-info h3{font-family:var(--font-display);font-size:clamp(26px,2.6vw,36px);line-height:1.12;letter-spacing:-.02em;margin:0}
.f-info p{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag-sq{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;padding:8px 14px;border-radius:10px;background:color-mix(in srgb,var(--p) 12%,var(--surface-2));color:color-mix(in srgb,var(--p) 75%,var(--text))}
.f-role{color:var(--text);font-size:15px}
.f-role b{font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:.06em;color:color-mix(in srgb,var(--p) 75%,var(--text));background:color-mix(in srgb,var(--p) 12%,var(--surface-2));padding:4px 10px;border-radius:8px;margin-right:8px}
.f-foot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:12px}
.link-btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--text);font:600 17px var(--font-body);cursor:pointer;padding:6px 0}
.link-btn svg{width:18px;height:18px;color:var(--accent-2);transition:transform .2s}
.link-btn:hover svg{transform:translateX(4px)}
.car-ctrl{display:flex;align-items:center;gap:12px}
.car-ctrl button.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;display:grid;place-items:center}
.car-ctrl button.arrow:hover{border-color:var(--accent-2)}
.car-ctrl svg{width:18px;height:18px}
.dots{display:flex;gap:6px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .25s,background .25s}
.dots span.on{width:22px;border-radius:4px;background:var(--p)}
.thumbs{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.thumb{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit;transition:border-color .2s,transform .2s}
.thumb:hover{transform:translateY(-3px)}
.thumb[aria-current="true"]{border-color:var(--tp,var(--accent-2))}
.thumb strong::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tp);margin-right:8px;vertical-align:middle}
.thumb .cover{min-height:0;aspect-ratio:1600/1195}
.thumb div.t{padding:14px 16px 16px}
.thumb strong{display:block;font-family:var(--font-display);font-size:18px}
.thumb span{font-size:13px;color:var(--muted)}
@media (max-width:960px){
  .featured{grid-template-columns:1fr}
  .featured .cover{aspect-ratio:1600/1195;min-height:0}
  .f-info{padding:28px 24px}
  .thumbs{grid-template-columns:repeat(2,1fr)}
}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);color:var(--text);padding:0;width:min(760px,100% - 32px);max-height:88svh}
dialog::backdrop{background:rgba(3,8,20,.7);backdrop-filter:blur(4px)}
.dlg-cover{aspect-ratio:1600/1195;position:relative;overflow:hidden;background:#06122C}
.dlg-cover svg,.dlg-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dlg-body{padding:32px 36px 36px}
.dlg-body h3{font-family:var(--font-display);font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 18px}
.dlg-body h4{font-family:var(--font-display);font-size:18px;margin:26px 0 10px}
.dlg-body p,.dlg-body li{color:var(--muted)}
.dlg-body ul{padding-left:20px;margin:0}
.dlg-body li{margin-bottom:8px}
.dlg-body li b{color:var(--text);font-weight:600}
.dlg-close{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(3,10,26,.6);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:2}
.dlg-close svg{width:18px;height:18px}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:72px;align-items:start}
.contact h2.title{max-width:14ch}
.contact-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.contact-list a{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .2s,color .2s}
.contact-list a:hover{padding-left:10px;color:var(--accent-2)}
.contact-list small{display:block;color:var(--muted);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;margin-bottom:2px}
.contact-list strong{font-weight:500;font-size:18px;word-break:break-word}
.contact-list svg{width:20px;height:20px;flex:none;color:var(--accent-2)}
@media (max-width:900px){.contact{grid-template-columns:1fr;gap:40px}}
footer{border-top:1px solid var(--line);padding:32px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- cursor & toast ---------- */
.cursor{position:fixed;left:0;top:0;width:40px;height:40px;border:1.5px solid var(--accent-2);border-radius:50%;pointer-events:none;z-index:100;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s,opacity .2s;opacity:0}
.cursor.big{width:64px;height:64px;background:var(--glow)}
@media (pointer:coarse),(prefers-reduced-motion:reduce){.cursor{display:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--surface);border:1px solid var(--accent-2);color:var(--text);padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

function coverHTML(p,small){
  if(!p.image) return coverSVG(p.id);
  return small ? `<img src="${p.thumb||p.image}" alt="" width="720" height="538" loading="lazy" decoding="async">`
               : `<img src="${p.image}" alt="${p.alt[lang]}" width="1600" height="1195" loading="lazy" decoding="async">`;
}

/* ---------- render ---------- */
let lang = "pt", current = 0;
try{ const s=localStorage.getItem("lang"); if(s==="en"||s==="pt") lang=s; }catch(e){}
const $ = s=>document.querySelector(s);
const nameOf = p => typeof p.name==="string" ? p.name : p.name[lang];

function render(){
  const t = I18N[lang];
  document.documentElement.lang = lang==="pt"?"pt-BR":"en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v=t[el.dataset.i18n]; if(v!==undefined) el.innerHTML=v; });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#stats").innerHTML = t.stats.map(([n,l])=>`<div><dt>${n}</dt><dd>${l}</dd></div>`).join("");
  $("#steps").innerHTML = STEPS.map(s=>`<li class="step"><div class="when mono">${s.when[lang]}</div><h4>${s.title[lang]}</h4><p>${s.text[lang]}</p></li>`).join("");
  $("#svcList").innerHTML = SERVICES.map(s=>`<li class="svc"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[s.icon]}</svg>${s.title[lang]}</h3><p>${s.text[lang]}</p><div class="chips">${(lang==="pt"?s.chips:s.chipsEn).map(c=>`<span class="chip">${c}</span>`).join("")}</div></li>`).join("");
  $("#thumbs").innerHTML = PROJECTS.map((p,i)=>`<button class="thumb" type="button" data-i="${i}" aria-current="${i===current}" style="--tp:${p.color}"><div class="cover">${coverHTML(p,true)}</div><div class="t"><strong>${nameOf(p)}</strong><span>${p.meta[lang]}</span></div></button>`).join("");
  $("#thumbs").querySelectorAll(".thumb").forEach(b=>b.onclick=()=>show(+b.dataset.i,true));
  show(current,false);
}
function show(i,scroll){
  current = (i+PROJECTS.length)%PROJECTS.length;
  const p = PROJECTS[current];
  $(".featured").style.setProperty("--p", p.color);
  $("#fCover").innerHTML = coverHTML(p);
  $("#fMeta").textContent = p.meta[lang];
  $("#fPill").textContent = p.pill[lang];
  $("#fTitle").textContent = p.title[lang];
  $("#fDesc").textContent = p.desc[lang];
  $("#fTags").innerHTML = p.tags[lang].map(x=>`<span class="tag-sq">${x}</span>`).join("");
  $("#fRole").innerHTML = `<b>${p.role[lang][0]}</b>${p.role[lang][1]}`;
  $("#dots").innerHTML = PROJECTS.map((_,k)=>`<span class="${k===current?"on":""}"></span>`).join("");
  document.querySelectorAll(".thumb").forEach(b=>b.setAttribute("aria-current", +b.dataset.i===current));
  if(scroll) $(".featured").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"center"});
}
$("#prev").onclick=()=>show(current-1);
$("#next").onclick=()=>show(current+1);
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem("lang",lang)}catch(e){} render(); });

/* ---------- case dialog ---------- */
const dlg = $("#caseDlg");
$("#openCase").onclick=()=>{
  const p=PROJECTS[current], t=I18N[lang];
  $("#dlgCover").innerHTML = coverHTML(p);
  $("#dlgBody").innerHTML = `<div class="mono" style="color:var(--muted)">${nameOf(p)} · ${p.meta[lang]}</div>
    <h3 id="dlgTitle">${p.title[lang]}</h3>
    <h4>${t["case.context"]}</h4><p>${p.ctx[lang]}</p>
    <h4>${t["case.did"]}</h4><ul>${p.did[lang].map(d=>`<li>${d}</li>`).join("")}</ul>
    <h4>${t["case.result"]}</h4>${Array.isArray(p.res[lang]) ? `<ul>${p.res[lang].map(r=>`<li>${r}</li>`).join("")}</ul>` : `<p>${p.res[lang]}</p>`}`;
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
};
$("#closeCase").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });

/* ---------- mobile menu & active link ---------- */
const menuBtn=$("#menuBtn"), links=$("#navLinks");
menuBtn.onclick=()=>{ const o=links.classList.toggle("open"); menuBtn.setAttribute("aria-expanded",o); };
links.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{links.classList.remove("open");menuBtn.setAttribute("aria-expanded",false);}));
const navMap={}; links.querySelectorAll("a").forEach(a=>navMap[a.getAttribute("href").slice(1)]=a);
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ Object.values(navMap).forEach(a=>a.removeAttribute("aria-current")); if(navMap[e.target.id]) navMap[e.target.id].setAttribute("aria-current","true"); }
}),{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("main > section").forEach(s=>io.observe(s));

/* ---------- toast ---------- */
let toastT; function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),3200); }

/* ---------- download do currículo ----------
   Fora do Claude o link funciona normalmente (download nativo).
   Dentro do Claude, usa a capacidade "downloads".               */
let dlApi = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d=>{ dlApi=d; }).catch(()=>{});
}
document.querySelectorAll(".cv-link").forEach(btn=>btn.addEventListener("click", async e=>{
  if (!window.claude) return;           // site hospedado: o navegador baixa o PDF normalmente
  e.preventDefault();
  if (!dlApi) { toast(I18N[lang]["toast.na"]); return; }
  try{
    const b64 = btn.getAttribute("href").split(",")[1];
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    await dlApi.save({filename:"Curriculo_Ismael_Oliveira.pdf", data:new Blob([bytes])});
    toast(I18N[lang]["toast.saved"]);
  }catch(err){
    toast(err && err.code==="declined" ? I18N[lang]["toast.declined"] : I18N[lang]["toast.na"]);
  }
}));

/* ---------- cursor ---------- */
const cur=$("#cursor"); let cx=0,cy=0,tx=0,ty=0;
if (matchMedia("(pointer:fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches){
  addEventListener("pointermove",e=>{ tx=e.clientX; ty=e.clientY; cur.style.opacity=1; });
  document.addEventListener("pointerleave",()=>cur.style.opacity=0);
  document.addEventListener("pointerover",e=>cur.classList.toggle("big", !!e.target.closest("a,button,.motion svg")));
  (function loop(){ cx+=(tx-cx)*.18; cy+=(ty-cy)*.18; cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`; requestAnimationFrame(loop); })();
}

/* ---------- hero: gráfico de motion (keyframes, curva e velocidade) ---------- */
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const P0=[90,420],P1=[270,420],P2=[330,110],P3=[550,110];
  const bz=(a,b,c,d,u)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d;};
  function uForX(x){let lo=0,hi=1;for(let i=0;i<22;i++){const m=(lo+hi)/2; if(bz(P0[0],P1[0],P2[0],P3[0],m)<x) lo=m; else hi=m;} return (lo+hi)/2;}
  const dot=$("#mDot"),glow=$("#mGlow"),trail=$("#mTrail"),head=$("#mHead"),frame=$("#mFrame"),obj=$("#mObj"),read=$("#mRead");
  const ghosts=[...document.querySelectorAll("#mGhosts rect")], streaks=[...document.querySelectorAll("#mStreaks path")];
  const hist=[]; const DUR=2400, HOLD=700; let lastV=0,lastT=0;
  function draw(p,now){
    const x=P0[0]+(P3[0]-P0[0])*p, u=uForX(x), y=bz(P0[1],P1[1],P2[1],P3[1],u);
    const v=(P0[1]-y)/(P0[1]-P3[1]);                // valor 0..1
    const ox=70+v*(570-70-34);                       // objeto na trilha
    const dt=Math.max(16,now-lastT), speed=Math.abs(v-lastV)*(570-104)/(dt/1000);
    lastV=v; lastT=now;
    dot.setAttribute("cx",x); dot.setAttribute("cy",y); glow.setAttribute("cx",x); glow.setAttribute("cy",y);
    head.setAttribute("transform",`translate(${x} 0)`);
    const fr=Math.round(p*72); frame.textContent=`00:${String(fr).padStart(2,"0")}`;
    hist.push([x,y]); if(hist.length>14) hist.shift();
    trail.setAttribute("points",hist.map(h=>h.join(",")).join(" "));
    obj.setAttribute("x",ox); obj.setAttribute("y",487);
    const k=Math.min(speed/900,1);
    ghosts.forEach((g,i)=>{ g.setAttribute("x",ox-(3-i)*14*k*dirSign); g.setAttribute("y",487); });
    streaks.forEach((st,i)=>{ const len=10+90*k*(1-i*.25), yy=493+i*11-5, sx=dirSign>0?ox-8-(i*6):ox+42+(i*6); st.setAttribute("d",`M${sx} ${yy}H${sx-len*dirSign}`); st.style.opacity=k>0.05?"":"0"; });
    read.textContent=`${Math.round(speed)} px/s`;
  }
  let dirSign=1;
  /* Loop automático + controle pelo mouse/toque:
     com o ponteiro sobre o gráfico, a agulha segue o eixo X do ponteiro.
     A velocidade do gesto vira a velocidade do objeto (rastro e linhas). */
  const svg=document.querySelector(".motion svg.graph");
  if(matchMedia("(pointer:coarse)").matches) $("#mHint").dataset.i18n="motion.hintTouch";
  let hover=false, target=0, curP=reduce?0.5:0, autoP=curP, dir=1, hold=0, prevNow=performance.now(), lastP=curP;
  function toP(e){ const r=svg.getBoundingClientRect(); const sx=(e.clientX-r.left)/r.width*640; return Math.min(1,Math.max(0,(sx-90)/460)); }
  function grab(e){ hover=true; target=toP(e); svg.classList.add("active"); }
  function release(){ hover=false; autoP=curP; dir=dirSign; hold=0; svg.classList.remove("active"); }
  svg.addEventListener("pointerenter",grab);
  svg.addEventListener("pointermove",grab);
  svg.addEventListener("pointerdown",grab);
  svg.addEventListener("pointerleave",release);
  svg.addEventListener("pointercancel",release);
  svg.addEventListener("pointerup",e=>{ if(e.pointerType!=="mouse") release(); });
  function loop(now){
    const dt=Math.min(64,now-prevNow); prevNow=now;
    if(hover){ curP+=(target-curP)*0.22; }
    else{
      if(!reduce){
        if(hold>0) hold-=dt;
        else{ autoP+=dir*dt/DUR; if(autoP>=1){autoP=1;dir=-1;hold=HOLD;} else if(autoP<=0){autoP=0;dir=1;hold=HOLD;} }
      }
      curP+=(autoP-curP)*0.25;
    }
    const d=curP-lastP; if(Math.abs(d)>1e-4) dirSign=d>0?1:-1; lastP=curP;
    draw(curP,now); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

try{ $("#year").textContent = new Date().getFullYear(); }catch(e){}
render();
</script>
